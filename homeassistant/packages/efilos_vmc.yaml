# Efilos VMC (Air Compact 415 Lite) via "Controlador TS IP" — Modbus TCP
#
# Install as a Home Assistant package:
#   configuration.yaml ->  homeassistant:
#                            packages: !include_dir_named packages
#   then drop this file into /config/packages/efilos_vmc.yaml and restart.
#
# Register numbers in the Efilos manual (page 17-19) are 1-based ("Gould").
# Home Assistant uses 0-based protocol addresses, so every address below is
# (manual register - 1). The manual number is kept in each comment.
#
# The controller drops Modbus-written values if no register is read for 10 s
# (manual: "Conn. a(s)", register 8503). The 5 s scan interval below keeps
# the session alive. If HA stops polling, the unit falls back to the values
# set on the touch panel, which is a safe failure mode.

modbus:
  - name: efilos_vmc
    type: tcp
    host: 192.168.107.48       # GL.iNet Mango's home-network IP (forwards 502 to the panel at 192.168.8.10)
    port: 502
    timeout: 5
    message_wait_milliseconds: 50

    sensors:
      # ---- Commands / configuration (holding registers, R/W) ----
      - name: VMC Speed Setpoint Raw          # manual reg 51
        unique_id: efilos_vmc_speed_setpoint_raw
        address: 50
        input_type: holding
        data_type: uint16
        scan_interval: 5

      - name: VMC Parameter Flags Raw         # manual reg 20
        unique_id: efilos_vmc_parameter_flags_raw
        address: 19
        input_type: holding
        data_type: uint16
        scan_interval: 5

      - name: VMC Filter Alarm Threshold      # manual reg 24, unit = 500 h
        unique_id: efilos_vmc_filter_threshold
        address: 23
        input_type: holding
        data_type: uint16
        scale: 500
        unit_of_measurement: h
        scan_interval: 3600

      # ---- Unit 1 data (read only) ----
      - name: VMC Outdoor Air Temperature     # manual reg 81 TEMP_E
        unique_id: efilos_vmc_temp_outdoor
        address: 80
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: VMC Extract Air Temperature     # manual reg 82 TEMP_R (air coming from the house)
        unique_id: efilos_vmc_temp_extract
        address: 81
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: VMC Exhaust Air Temperature     # manual reg 83 TEMP_X (air expelled outside)
        unique_id: efilos_vmc_temp_exhaust
        address: 82
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: VMC Supply Air Temperature      # manual reg 84 TEMP_I (air blown into the house)
        unique_id: efilos_vmc_temp_supply
        address: 83
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: VMC Status Flags Raw            # manual reg 86
        unique_id: efilos_vmc_status_flags_raw
        address: 85
        input_type: holding
        data_type: uint16
        scan_interval: 10

      - name: VMC Supply Fan Speed            # manual reg 87, this unit reports rpm
        unique_id: efilos_vmc_supply_fan_speed
        address: 86
        input_type: holding
        data_type: uint16
        unit_of_measurement: rpm
        state_class: measurement
        scan_interval: 10

      - name: VMC Extract Fan Speed           # manual reg 88, this unit reports rpm
        unique_id: efilos_vmc_extract_fan_speed
        address: 87
        input_type: holding
        data_type: uint16
        unit_of_measurement: rpm
        state_class: measurement
        scan_interval: 10

      - name: VMC Air Quality Input           # manual reg 89 (CO2/VOC/humidity/0-10V sensor, if fitted)
        unique_id: efilos_vmc_auto_input
        address: 88
        input_type: holding
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
        scan_interval: 30

      - name: VMC Alarms 1 Raw                # manual reg 90
        unique_id: efilos_vmc_alarms1_raw
        address: 89
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: VMC Supply Airflow              # manual reg 93 (only with CAV/COP kit)
        unique_id: efilos_vmc_flow_supply
        address: 92
        input_type: holding
        data_type: uint16
        unit_of_measurement: "m³/h"
        state_class: measurement
        scan_interval: 30

      - name: VMC Extract Airflow             # manual reg 94 (only with CAV/COP kit)
        unique_id: efilos_vmc_flow_extract
        address: 93
        input_type: holding
        data_type: uint16
        unit_of_measurement: "m³/h"
        state_class: measurement
        scan_interval: 30

      - name: VMC Fan Running Hours           # manual regs 95 (high word) + 96 (low word)
        unique_id: efilos_vmc_fan_hours
        address: 94
        input_type: holding
        data_type: uint32
        unit_of_measurement: h
        device_class: duration
        state_class: total_increasing
        scan_interval: 600

      - name: VMC Alarms 2 Raw                # manual reg 97
        unique_id: efilos_vmc_alarms2_raw
        address: 96
        input_type: holding
        data_type: uint16
        scan_interval: 30

template:
  - binary_sensor:
      - name: VMC Bypass Open
        unique_id: efilos_vmc_bypass_open
        state: "{{ states('sensor.vmc_status_flags_raw') | int(0) | bitwise_and(1) > 0 }}"
        availability: "{{ has_value('sensor.vmc_status_flags_raw') }}"

      - name: VMC Antifrost Active
        unique_id: efilos_vmc_antifrost
        state: "{{ states('sensor.vmc_status_flags_raw') | int(0) | bitwise_and(16) > 0 }}"
        availability: "{{ has_value('sensor.vmc_status_flags_raw') }}"

      - name: VMC Filter Alarm
        unique_id: efilos_vmc_filter_alarm
        device_class: problem
        state: "{{ states('sensor.vmc_alarms_1_raw') | int(0) | bitwise_and(16) > 0 }}"
        availability: "{{ has_value('sensor.vmc_alarms_1_raw') }}"

      - name: VMC Fan Failure
        unique_id: efilos_vmc_fan_failure
        device_class: problem
        state: "{{ states('sensor.vmc_alarms_1_raw') | int(0) | bitwise_and(32) > 0 }}"
        availability: "{{ has_value('sensor.vmc_alarms_1_raw') }}"

      - name: VMC Any Alarm
        unique_id: efilos_vmc_any_alarm
        device_class: problem
        # Alarms 1 bit 4 (filters) is excluded here because it has its own sensor.
        state: >
          {{ (states('sensor.vmc_alarms_1_raw') | int(0) | bitwise_and(65519)) > 0
             or (states('sensor.vmc_alarms_2_raw') | int(0) | bitwise_and(1023)) > 0 }}
        attributes:
          alarms_1: "{{ states('sensor.vmc_alarms_1_raw') }}"
          alarms_2: "{{ states('sensor.vmc_alarms_2_raw') }}"
        availability: >
          {{ has_value('sensor.vmc_alarms_1_raw') and has_value('sensor.vmc_alarms_2_raw') }}

  - select:
      # Register 20 bits 2-3: 0 = auto, 1 = forced closed, 2 = forced open
      - name: VMC Bypass Mode
        unique_id: efilos_vmc_bypass_mode
        options: "{{ ['Auto', 'Closed', 'Open'] }}"
        availability: "{{ has_value('sensor.vmc_parameter_flags_raw') }}"
        state: >
          {% set v = (states('sensor.vmc_parameter_flags_raw') | int(0) // 4) % 4 %}
          {{ ['Auto', 'Closed', 'Open'][v] if v < 3 else 'Auto' }}
        select_option:
          - action: script.vmc_write_flag_bits
            data:
              mask: 12
              bits: "{{ {'Auto': 0, 'Closed': 4, 'Open': 8}[option] }}"

      # Register 20 bits 0-1: 0 = auto, 1 = winter, 2 = summer
      - name: VMC Season
        unique_id: efilos_vmc_season
        options: "{{ ['Auto', 'Winter', 'Summer'] }}"
        availability: "{{ has_value('sensor.vmc_parameter_flags_raw') }}"
        state: >
          {% set v = states('sensor.vmc_parameter_flags_raw') | int(0) % 4 %}
          {{ ['Auto', 'Winter', 'Summer'][v] if v < 3 else 'Auto' }}
        select_option:
          - action: script.vmc_write_flag_bits
            data:
              mask: 3
              bits: "{{ {'Auto': 0, 'Winter': 1, 'Summer': 2}[option] }}"

  - fan:
      - name: VMC
        unique_id: efilos_vmc_fan
        availability: >
          {{ has_value('sensor.vmc_parameter_flags_raw') and has_value('sensor.vmc_speed_setpoint_raw') }}
        # Register 20 bit 5 = "speed switch off" (1 = fans stopped)
        state: >
          {{ 'off' if states('sensor.vmc_parameter_flags_raw') | int(0) | bitwise_and(32) > 0 else 'on' }}
        # Register 51: 0-100 = %, 101 = weekly schedule, 102 = auto (air-quality sensor).
        # In Schedule/Auto there is no fixed %, so the slider shows no value.
        percentage: >
          {% set sp = states('sensor.vmc_speed_setpoint_raw') | int(0) %}
          {{ sp if sp <= 100 else none }}
        preset_mode: >
          {% set sp = states('sensor.vmc_speed_setpoint_raw') | int(0) %}
          {{ {101: 'Schedule', 102: 'Auto'}.get(sp, 'none') }}
        preset_modes:
          - Schedule
          - Auto
        speed_count: 20          # 5 % steps in the UI slider
        turn_on:
          - action: script.vmc_write_flag_bits
            data:
              mask: 32
              bits: 0
        turn_off:
          - action: script.vmc_write_flag_bits
            data:
              mask: 32
              bits: 32
        set_percentage:
          - if: "{{ percentage | int == 0 }}"
            then:
              - action: script.vmc_write_flag_bits
                data:
                  mask: 32
                  bits: 32
            else:
              - action: modbus.write_register
                data:
                  hub: efilos_vmc
                  address: 50
                  value: "{{ percentage | int }}"
              - action: script.vmc_write_flag_bits
                data:
                  mask: 32
                  bits: 0
        set_preset_mode:
          - action: modbus.write_register
            data:
              hub: efilos_vmc
              address: 50
              value: "{{ {'Schedule': 101, 'Auto': 102}[preset_mode] }}"

script:
  # Read-modify-write on register 20, so changing one setting keeps the others.
  vmc_write_flag_bits:
    alias: VMC write parameter flag bits
    mode: queued
    fields:
      mask:
        description: Bits to change (e.g. 12 for bypass bits 2-3)
      bits:
        description: New value of those bits, already shifted into place
    sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.vmc_parameter_flags_raw
      - variables:
          current: "{{ states('sensor.vmc_parameter_flags_raw') | int(-1) }}"
      - condition: template
        value_template: "{{ current >= 0 }}"
      - action: modbus.write_register
        data:
          hub: efilos_vmc
          address: 19
          value: >
            {{ (current | bitwise_and(65535 - (mask | int)))
               | bitwise_or((bits | int) | bitwise_and(mask | int)) }}
      - delay: 1
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.vmc_parameter_flags_raw
